<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
<!-- Flowboard Steel Tide ground, frozen at t=0: same field, bands and blur as video/assets/backdrop.js and components/liquid-ground.js -->
<defs><linearGradient id="field" x1="0" y1="0" x2=".34" y2=".94"><stop offset="0" stop-color="#324358"/><stop offset=".36" stop-color="#5F7C98"/><stop offset=".6" stop-color="#BAD2E1"/><stop offset=".86" stop-color="#D6D8DA"/></linearGradient>
<linearGradient id="deep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#293648"/><stop offset="1" stop-color="#435B74" stop-opacity=".2"/></linearGradient>
<linearGradient id="light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DBE8EF" stop-opacity=".2"/><stop offset=".5" stop-color="#DBE8EF"/><stop offset="1" stop-color="#99B8CF" stop-opacity=".3"/></linearGradient>
<linearGradient id="mid" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F7C98" stop-opacity=".1"/><stop offset=".6" stop-color="#6F8FAB"/><stop offset="1" stop-color="#BAD2E1" stop-opacity=".2"/></linearGradient>
